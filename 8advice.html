function renderSteps(){

 if(!(numv('qty')>0)||!(numv('price')>0)){box.innerHTML='<div class="step"><div class="q">先に、①で数量と単価を入れてください</div></div>';$('pg').style.width='0';return}
 cur=ok.indexOf(false);if(cur<0)cur=S.length;
 var blocked=(cur>=LOCK_AT&&!stamped),lastRole='';
 S.forEach(function(s,i){
  if(s.role!==lastRole){var r=document.createElement('div');r.className='role '+s.role;r.textContent='輸出者（あなたの会社）として　最後の仕事';box.appendChild(r);lastRole=s.role}
  if(i===LOCK_AT)box.appendChild(lockEl());
  var d=document.createElement('div'),dn=ok[i],isCur=(i===cur&&!blocked);
  d.className='step'+(dn?' done':(!isCur?' lock':''));
  var head='<div class="q"><span class="tag">'+s.sec+'</span>'+esc(s.q)+'</div>';
  if(dn)d.innerHTML=head+'<div class="msg ok">'+esc(s.f())+'</div><div class="mean"><b>意味</b>　'+esc(s.m)+'</div>';
  else if(isCur)d.innerHTML=head+'<p class="how2">'+esc(s.how)+'</p><div class="chs">'+s.choice.map(function(c,j){return '<button data-c="'+j+'">'+esc(c)+'</button>'}).join('')+'</div><div class="msg" id="ms"></div><div class="hint" id="ht">'+esc(s.hint)+'</div><button class="g" id="hb" style="margin-top:8px">ヒント</button>';
  else d.innerHTML=head;
  box.appendChild(d);
 });
 if(cur>=S.length){var e=document.createElement('div');e.innerHTML='<div class="step done"><div class="q">輸出の仕事は、ここで終わりです</div><div class="mean">Offer（第4回）→ 契約（第5回）→ 書類（第6回）→ 船の予約・申告・B/L（第7回）→ 船積通知（第8回）。下の③で、2枚の書類を確かめて、PDFに保存しましょう。保存したら、輸出の仕事は完了です。</div></div></div>';box.appendChild(e)}
 $('pg').style.width=(ok.filter(Boolean).length/S.length*100)+'%';
 $('note').textContent=note;
 if(cur<S.length&&!blocked){$('hb').onclick=function(){$('ht').style.display='block'};box.querySelectorAll('.chs button').forEach(function(b){b.onclick=function(){answerChoice(+b.dataset.c)}})}
 var w=$('wd');if(w){$('nx').onclick=openStamp;w.onkeydown=function(e){if(e.key==='Enter')openStamp()}}
}
function lockEl(){
 var d=document.createElement('div');
 if(stamped){d.className='step done';d.innerHTML='<div class="q"><span class="tag">船会社</span>B/L の原本を回収しました</div><div class="msg ok"><span class="stampS">SURRENDERED</span></div><div class="mean"><b>意味</b>　清水の船会社が、原本を回収した印です。この印のあるコピーを、買い手に送ります。</div>';return d}
 var ready=ok.slice(0,LOCK_AT).every(Boolean);
 d.className='lockcard'+(ready?'':' step lock');
 d.innerHTML='<div class="q">船会社の印：先生（清水の船会社）が「SURRENDERED」の印を押すと、合言葉が出ます</div>'+(ready?'<p class="how2">原本を船会社に返しました。先生（船会社）の合言葉を待って、入れてください（半角英字）。</p><div class="row"><input id="wd" autocomplete="off" placeholder="合言葉（半角英字）"><button id="nx">印を押す</button></div><div class="msg" id="wm"></div>':'<p class="how2">B/L の3問が終わると、ここに入力欄が出ます。</p>');
 return d;
}
function openStamp(){
 var w=z($('wd').value).replace(/[Ａ-Ｚａ-ｚ]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)}).trim().toLowerCase();
 if(w!==WORD){var m=$('wm');m.className='msg ng';m.textContent='合言葉が違います。先生（船会社）が言う言葉を、半角英字で入れてください';return}
 stamped=true;render();
}

function warp(){
 var W=$('warp'),d=$('wdate'),m=$('wmsg'),c=$('wclose');W.classList.add('on');m.textContent='';c.style.display='none';d.className='wd1';
 var hh=W.querySelector('.hh'),mh=W.querySelector('.mh');[hh,mh].forEach(function(x){x.style.animation='none';void x.offsetWidth;x.style.animation=''});
 var ds=['20 November 2026','11 November 2026','4 November 2026','30 October 2026','28 October 2026'],k=0;
 var t=setInterval(function(){k++;if(k<ds.length){d.textContent=ds[k];d.className='wd1'+(k%2?' mir':'')}else{clearInterval(t);d.className='wd1';
  m.innerHTML='時計の針が、Offer の日まで戻りました。<br>……でも、何かが違う。<br><b>今度は、中国からみかん缶が来ます。<br>あなたは、日本の輸入者です。</b><br>続きは、先生の合図で。';c.style.display='inline-block'}},800);
 c.onclick=function(){W.classList.remove('on')};
}
/* ---- 書類 ---- */
function B(x,w){x=(x==null?'':String(x)).trim();return x?esc(x):'<span class="blank" style="min-width:'+(w||7)+'em"></span>'}
function goods(){return 'CANNED MANDARIN ORANGES<br>425 g × 24 cans per carton'}
function sheetBL(){
 var n=nums();
 return '<span class="copy">COPY</span><h3>BILL OF LADING</h3><div class="h3s">船荷証券（コピー・Non-negotiable）</div>'+
 '<table><tr><td style="width:55%"><span class="lbl">Shipper</span><b>'+B(val('company'),16)+'</b><br>Shizuoka, Japan</td><td><span class="lbl">B/L No.</span>'+FIX.bl+'</td></tr>'+
 '<tr><td><span class="lbl">Consignee</span><b>'+FIX.buyer+'</b><br>'+FIX.baddr+'</td><td rowspan="2"><span class="lbl">Carrier</span>'+FIX.carrier+'<br><br><span class="lbl">Forwarder</span>'+FIX.fwd+'</td></tr>'+
 '<tr><td><span class="lbl">Notify party</span><b>'+FIX.buyer+'</b><br>Attn: '+FIX.attn+'</td></tr></table>'+
 '<table><tr><td><span class="lbl">Ocean vessel / Voy. No.</span>'+FIX.vessel+' / '+FIX.voy+'</td><td><span class="lbl">Port of loading</span>Shimizu, Japan</td><td><span class="lbl">Port of discharge</span>Shanghai, China</td></tr></table>'+
 '<table><colgroup><col style="width:24%"><col style="width:16%"><col style="width:30%"><col style="width:15%"><col style="width:15%"></colgroup><tr><th>Container No. / Seal No.<br>Marks</th><th class="r">No. of packages</th><th>Description of goods</th><th class="r">Gross Weight</th><th class="r">Measurement</th></tr>'+
 '<tr><td>'+FIX.ctr+'<br>Seal '+FIX.seal+'<br><br>'+B(val('m1'),3)+'<br>'+B(val('m2'),3)+'</td><td class="r">'+nf(n.q)+' CARTONS</td><td>1 × 20ft container<br>SHIPPER\'S LOAD &amp; COUNT<br>SAID TO CONTAIN:<br>'+goods()+'</td><td class="r">'+nf(n.gw)+' kg</td><td class="r">'+n.vol.toFixed(1)+' m³</td></tr></table>'+
 '<table><tr><td><span class="lbl">Freight</span><b>FREIGHT PREPAID</b></td><td><span class="lbl">Number of original B/L</span>THREE (3)</td></tr>'+
 '<tr><td><span class="lbl">Shipped on board</span>'+FIX.etd+'</td><td><span class="lbl">Place and date of issue</span>Shimizu, '+FIX.etd+'</td></tr></table>'+
 '<div class="box"><span class="lbl">Remarks</span>CLEAN ON BOARD (no exceptions noted)</div>'+
 (stamped?'<div class="surr">SURRENDERED<small>Original B/L (3/3) collected at Shimizu<br>'+FIX.etd+'</small></div>':'<div class="note">（船会社の印は、まだ押されていません）</div>');
}
function sheetSA(){
 var n=nums(),c=val('company'),sg=val('signer'),A=function(i,t,w){return ok[i]?t:B('',w||10)};
 var row=function(k,v){return '<tr><td style="width:34%">'+k+'</td><td>'+v+'</td></tr>'};
 return '<div style="border:2px solid #222;padding:8px;text-align:center;margin:0 40px 14px"><div style="font:600 18px/1.3 Georgia,serif;letter-spacing:.06em">'+B(c,16)+'</div><div style="font-size:12px">Shizuoka, Japan</div></div>'+
 '<h3 style="font-family:Georgia,serif;letter-spacing:.08em">SHIPPING ADVICE</h3><div class="h3s">船積通知（教科書 p.246 の書式）</div>'+
 '<div style="text-align:right;margin:0 0 10px">Date: '+A(3,FIX.etd,9)+'</div>'+
 '<div style="border:1px solid #222;padding:6px 10px;margin:0 0 14px;width:70%">Messrs.<br>'+A(4,'<b>'+FIX.buyer+'</b><br>Attn: '+FIX.attn+'<br>'+FIX.baddr,14)+'</div>'+
 '<p>We are pleased to inform you that we have shipped your order as follows:</p>'+
 '<table>'+row('Name of Vessel',FIX.vessel+' / Voy. '+FIX.voy)+row('ETD',FIX.etd)+row('Port of Loading','Shimizu, Japan')+row('Port of Discharge','Shanghai, China')+row('ETA',FIX.eta)+
 row('Number of Packages',nf(n.q)+' CARTONS（G.W. '+nf(n.gw)+' kg / '+n.vol.toFixed(1)+' m³）')+
 row('Remarks','Canned Mandarin Oranges, 425 g × 24 cans per carton<br>20F × 1 Container（'+FIX.ctr+' / Seal '+FIX.seal+'）<br>Marks: '+B(val('m1'),3)+', '+B(val('m2'),3)+'　Invoice No. '+B(val('invno'),6)+'<br>B/L No. '+FIX.bl+(ok[0]&&stamped?'（<b>SURRENDERED</b> at Shimizu: the cargo can be released in Shanghai without the original B/L）':'')+'<br>Terms: CFR Shanghai（marine insurance to be covered by the Buyer）')+'</table>'+
 '<p>Enclosed: '+A(5,'copies of Invoice, Packing List and B/L (SURRENDERED)',16)+'</p>'+
 '<p>We trust that this shipment will reach you in good order.</p>'+
 '<div style="margin:30px 0 0 auto;width:55%;text-align:center"><div style="border-top:1px solid #222;padding-top:4px">'+B(sg,12)+'<br>'+B(c,14)+'</div></div>';
}
function sheetIM(){
 var a=function(i){return ok[i]?esc(S[i].f()):B('',12)};
 return '<h3>IMPORTER\'S CHECK</h3><div class="h3s">輸入者（SH TRADING）の確認メモ</div>'+
 '<table><tr><td style="width:50%"><span class="lbl">Arrival Notice（貨物到着案内） from</span>Carrier\'s agent, Shanghai（授業用）</td><td><span class="lbl">Vessel / Voy.</span>'+FIX.vessel+' / '+FIX.voy+'</td></tr>'+
 '<tr><td><span class="lbl">ETA Shanghai</span><b>'+(ok[7]?FIX.eta:B('',9))+'</b></td><td><span class="lbl">Freight charges</span>'+(ok[8]?'None（FREIGHT PREPAID）':B('',9))+'</td></tr>'+
 '<tr><td><span class="lbl">B/L</span>'+FIX.bl+(stamped?' — SURRENDERED':'')+'</td><td><span class="lbl">Consignee</span>'+FIX.buyer+'</td></tr></table>'+
 '<table class="ans"><colgroup><col style="width:44%"><col style="width:56%"></colgroup><tr><th>確認したこと</th><th>答え</th></tr>'+
 '<tr><td>CFR。船積通知を受けて、すること</td><td>'+a(6)+'</td></tr>'+
 '<tr><td>本船の到着予定日（ETA）</td><td>'+a(7)+'</td></tr>'+
 '<tr><td>貨物到着案内に、運賃の請求は？</td><td>'+a(8)+'</td></tr>'+
 '<tr><td>SHIPPER\'S LOAD &amp; COUNT／SAID TO CONTAIN</td><td>'+a(9)+'</td></tr>'+
 '<tr><td>原本なしで受け取れる理由</td><td>'+a(10)+'</td></tr></table>'+
 '<div class="box"><span class="lbl">Next（次にすること）</span>貨物の引き取りは、D/O（荷渡し指図書）と輸入通関で。→ 第9〜11回</div>';
}
function renderDocs(){
 var hs=[sheetBL(),sheetSA()];
 $('pvs').innerHTML=hs.map(function(h,i){return '<div class="pv'+(i!==tab?' tabhide':'')+(i===1?' lastp':'')+'"><div class="sheet">'+h+'</div></div>'}).join('');
 $('tabs').innerHTML=['① B/L（コピー）','② Shipping Advice'].map(function(t,i){return '<button data-t="'+i+'" class="'+(i===tab?'on':'')+'">'+t+'</button>'}).join('');
 $('tabs').querySelectorAll('button').forEach(function(b){b.onclick=function(){tab=+b.dataset.t;renderDocs()}});
 fit();
}
function fit(){document.querySelectorAll('.pv').forEach(function(pv){var sh=pv.firstElementChild,w=pv.clientWidth;if(!w)return;var k=Math.min(1,w/794);sh.style.transform=k<1?'scale('+k+')':'';pv.style.height=k<1?Math.ceil(sh.offsetHeight*k)+'px':''})}
window.addEventListener('resize',fit);
function renderShip(){
 var n=nums();
 $('ship').innerHTML='<b>今回の船積み（第7回のブッキングのとおり）</b><table class="t"><tr><td>本船</td><td>'+FIX.vessel+' / Voy. '+FIX.voy+'</td></tr><tr><td>出港（ETD）</td><td>'+FIX.etd+'（清水）</td></tr><tr><td>到着予定（ETA）</td><td>'+FIX.eta+'（上海）</td></tr><tr><td>B/L No.</td><td>'+FIX.bl+'</td></tr><tr><td>数量・金額</td><td>'+nf(n.q)+' ctn／USD '+mny(n.tot)+'</td></tr><tr><td>決済</td><td>T/T in advance（受け取り済み）</td></tr></table>';
}
function renderFlow(){
 var st=[['B/L の扱い',ok.slice(0,3).every(Boolean)],['船会社の印',stamped],['船積通知',ok.slice(3,6).every(Boolean)]];
 var on=st.findIndex(function(x){return !x[1]});
 $('flow').innerHTML=st.map(function(x,i){return '<span class="'+(x[1]?'dn':(i===on?'on':''))+'">'+(x[1]?'✓ ':'')+x[0]+'</span>'}).join('<span style="border:0;background:none;padding:3px 0">→</span>');
}
function renderChecks(){
 var L=[];function add(c,t){L.push('<li class="'+(c?'y':'n')+'">'+(c?'○ ':'× ')+t+'</li>')}
 add(!!val('company')&&!!val('signer'),'会社名と署名する人が入っている');
 add(!!val('m1')&&!!val('m2')&&val('m1')!==val('m2'),'荷印が2つ、別の文字で入っている');
 add(stamped,'B/L に SURRENDERED の印がある');
 add(ok.slice(3,6).every(Boolean),'船積通知が、最後まで埋まっている');
 $('checks').innerHTML=L.join('');
}
function allDone(){return stamped&&ok.every(Boolean)}
function renderInbox(){
 var b=$('ibx');if(!b)return;
 if(!(allDone()&&saved)){b.innerHTML='';return}
 b.innerHTML='<div class="step done"><div class="q">輸出の仕事、完了です</div><div class="mean">PDF を保存しました。Offer から船積通知まで、おつかれさまでした。</div></div><div class="inbox"><div class="ibh">受信トレイ　新着 1件</div><div class="ibm"><b>From:</b> ORANGE HARBOR FOODS CO., LTD.（授業用）<br><b>Subject:</b> Offer – Canned Mandarin Oranges<br><span>見慣れない差出人です。先生の合図があるまで、開かないでください。</span></div><button id="openIb">メールを開く</button></div>';
 $('openIb').onclick=warp;
}
function render(){renderShip();renderSteps();renderDocs();renderChecks();renderFlow();renderInbox();savePg()}

KEYS.forEach(function(k){$(k).addEventListener('input',function(){saveIn();render()})});
$('imp').onclick=function(){var m=$('impMsg'),g=applyPrev();saveIn();render();m.className=g.length?'msg ok':'msg ng';m.textContent=g.length?'読み込みました：'+g.join('・')+'。目で確認してください。':'読み込める内容がありません（前回までと別のスマホやブラウザで開いている場合は、手で入力するか、困ったときの「見本を入れる」を使ってください）。'};
$('print').onclick=function(){
 var old=document.title,cn=val('company').replace(/[^\w\-]+/g,'_').replace(/^_+|_+$/g,'');
 document.title='Shipping_advice_'+(cn||'draft');
 $('pm').className='msg';$('pm').textContent=stamped?'印刷画面で「PDFに保存」を選んでください（2ページ）。':'まだ SURRENDERED の印がありません。先生（船会社）の合言葉のあとに、もう一度保存してください。';
 try{window.print()}catch(e){$('pm').textContent='印刷画面を開けませんでした。ブラウザのメニューから印刷してください。'}
 setTimeout(function(){document.title=old},800);
 if(allDone()&&!saved){setTimeout(function(){saved=true;render();$('pm').className='msg ok';$('pm').textContent='保存しました。輸出の仕事、完了です。';var b=$('ibx');if(b&&b.scrollIntoView)b.scrollIntoView({behavior:'smooth',block:'center'})},1500)}
};
function fillFrom(one){var g=0;while(g++<20){var c=ok.indexOf(false);if(c<0)break;if(c>=LOCK_AT&&!stamped)break;ok[c]=true;if(one)break}}
function needQ(){if(!(numv('qty')>0)||!(numv('price')>0)){$('hm').textContent='先に、①で数量と単価を入れてください。';return true}return false}
$('h1').onclick=function(){if(needQ())return;var c=ok.indexOf(false);if(c<0)return;if(c>=LOCK_AT&&!stamped){$('hm').textContent='ここから先は、先生（船会社）の印が必要です。合言葉を待ってください。';return}fillFrom(true);note='';render();$('hm').textContent='答えを入れました。「意味」を読んでください。'};
$('h2').onclick=function(){if(needQ())return;fillFrom(false);note='';render();$('hm').textContent=stamped?'最後まで入りました。入った答えと「意味」を読んでください。':'B/L の3問まで入りました。この先は、先生（船会社）の印のあとです。'};
$('h3').onclick=function(){ok=ok.map(function(){return false});note='';render();$('hm').textContent='②の最初に戻りました。（船会社の印は、そのままです）'};
$('hS').onclick=function(){if(!val('company'))$('company').value='SAMPLE TRADING CO., LTD.';if(!val('signer'))$('signer').value='Hanako Sato, Export Manager';if(!val('m1'))$('m1').value='A01';if(!val('m2'))$('m2').value='B02';if(!val('invno'))$('invno').value='INV-001';saveIn();render();$('hm').textContent='見本を入れました。会社名などは、自分のものに直してください。'};
$('hD').onclick=function(){$('qty').value=DEF.qty;$('price').value=DEF.price;saveIn();render();$('hm').textContent='標準Offer（1,600 ctn／USD 17.70）に戻しました。'};
if(teacher){
 var tb=$('tbar');tb.style.display='block';
 tb.innerHTML='<b>先生用</b>　合言葉（船会社の印）：<b>'+WORD+'</b><br><button id="tA">印の前まで全部入れる</button> <button id="tP">印を押す</button> <button id="tB">全部入れる</button> <button id="tV">PDF保存済み（受信トレイを出す）</button> <button id="tC">最初から</button>';
 $('tA').onclick=function(){if(needQ())return;for(var i=0;i<LOCK_AT;i++)ok[i]=true;render()};
 $('tP').onclick=function(){stamped=true;render()};
 $('tV')&&($('tV').onclick=function(){saved=true;render()});
 $('tB').onclick=function(){if(needQ())return;stamped=true;ok=ok.map(function(){return true});render()};
 $('tC').onclick=function(){ok=ok.map(function(){return false});stamped=false;saved=false;render()};
}
loadAll();render();
})();
</script>
